name = "form-checker-api"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ALLOWED_ORIGIN = "https://web-soudan.co.jp"

# ローカル開発用: wrangler secret put ANTHROPIC_API_KEY
# 本番: Cloudflare Dashboard > Workers > Settings > Variables で設定

[[d1_databases]]
binding = "DB"
database_name = "form-checker-db"
database_id = "f6528b2d-2685-459d-a72a-556ec3dfc806"  # npx wrangler d1 create form-checker-db で取得
migrations_dir = "migrations"
